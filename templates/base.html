<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DISTANS{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e0e0e0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #f5f5f5;
            font-size: 14px;
            transition: background-color 0.3s;
            font-family: Arial, sans-serif;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus,
        input[type="tel"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            background-color: #ffffff;
        }

        button {
            padding: 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .errorlist {
            list-style: none;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #ffebee;
            border-left: 4px solid #f44336;
            border-radius: 4px;
            color: #c62828;
            font-size: 14px;
        }

        .errorlist li {
            margin-bottom: 5px;
        }

        .errorlist li:last-child {
            margin-bottom: 0;
        }

        .form-field-error {
            margin-top: 5px;
        }

        .form-field-error .errorlist {
            margin-bottom: 0;
            padding: 5px;
            font-size: 12px;
        }

        a {
            color: #4caf50;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .messages {
            width: min(1200px, calc(100% - 40px));
            margin: 16px auto 0;
            display: grid;
            gap: 10px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .message-success {
            background: #e8f5e9;
            color: #1b5e20;
            border-left: 4px solid #4caf50;
        }

        .message-error {
            background: #ffebee;
            color: #b71c1c;
            border-left: 4px solid #f44336;
        }

        .message-warning {
            background: #fff8e1;
            color: #8d6e00;
            border-left: 4px solid #ffc107;
        }

        .message-info {
            background: #e3f2fd;
            color: #0d47a1;
            border-left: 4px solid #2196f3;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "header.html" %}
    {% include "navbar.html" %}

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message message-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
