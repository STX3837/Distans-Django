{% extends "base.html" %}
{% block extra_css %}<style>
.reset-container{background:#c8f7d8;padding:40px;border-radius:8px;width:100%;max-width:480px;margin:40px auto;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.reset-container h1{text-align:center;font-size:24px;margin-bottom:20px}.reset-container p{line-height:1.5}.reset-container label{display:block;margin:16px 0 8px;font-weight:bold}.reset-container input{width:100%;padding:12px;border:0;border-radius:4px;background:#f5f5f5}.reset-container button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:4px;background:#4caf50;color:white;font-weight:bold;cursor:pointer}.reset-container .errorlist{color:#a01616}.reset-container a{color:#287a3d;font-weight:bold}
</style>{% endblock %}
{% block content %}<div class="reset-container">{% block reset_content %}{% endblock %}</div>{% endblock %}
